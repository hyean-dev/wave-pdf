name: Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'css/**', 'vendor/**', 'fonts/**', 'icons/**', 'apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Web files into the app
        working-directory: apk
        run: |
          npm ci --no-audit --no-fund
          node copy-web.mjs
          npx cap sync android
      - name: Build APK
        working-directory: apk/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wave.keystore"; export KEYSTORE_PATH="$RUNNER_TEMP/wave.keystore"; fi
          export VERSION_NAME=$(grep -oP "APP_VERSION = '\K[^']+" ../../js/app.js)
          export VERSION_CODE=${{ github.run_number }}
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode none
          cp app/build/outputs/apk/release/app-release.apk ../../WavePDF.apk
      - name: Publish (release "apk-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "APP_VERSION = '\K[^']+" js/app.js)
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest WavePDF.apk --title "Wave PDF 안드로이드 앱 (v$V)" \
            --notes "태블릿·휴대폰용 설치 파일. 받아서 열면 설치돼요. 버전 $V · $(date -u +%Y-%m-%d)" --latest
