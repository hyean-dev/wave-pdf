<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f3b5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wave PDF">
  <title>Wave PDF</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/pdfjs-5.7.284/pdf_viewer.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // ?reset=1 : clear service worker, caches and saved session, then restart (recovery link)
    if (/[?&]reset\b/.test(location.search)) {
      document.write('<p style="font:16px sans-serif;padding:24px">초기화 중…</p>');
      (async function () {
        try { var rs = await navigator.serviceWorker.getRegistrations(); for (var r of rs) await r.unregister(); } catch (e) {}
        try { var ks = await caches.keys(); for (var k of ks) await caches.delete(k); } catch (e) {}
        try { indexedDB.deleteDatabase('wavepdf'); } catch (e) {}
        location.replace(location.pathname);
      })();
      throw new Error('resetting');
    }
  </script>
  <script>
    // Show startup errors on screen and offer a cache reset (helps installed apps recover)
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return; shown = true;
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9999;background:#fff3f3;border:1px solid #e57373;border-radius:12px;padding:12px;font:14px sans-serif;color:#b71c1c;box-shadow:0 4px 20px rgba(0,0,0,.2)';
        d.innerHTML = '<b>앱을 시작하지 못했어요</b><div style="margin:6px 0;color:#555;word-break:break-all;font-size:12px"></div><button style="padding:8px 14px;border-radius:8px;border:0;background:#0f3b5f;color:#fff">캐시 지우고 다시 시작</button>';
        d.children[1].textContent = String(msg).slice(0, 300);
        d.querySelector('button').onclick = async function () {
          try { var rs = await navigator.serviceWorker.getRegistrations(); for (var r of rs) await r.unregister(); } catch (e) {}
          try { var ks = await caches.keys(); for (var k of ks) if (k.indexOf('wavepdf-share') < 0) await caches.delete(k); } catch (e) {}
          location.reload();
        };
        (document.body || document.documentElement).appendChild(d);
      }
      window.addEventListener('error', function (e) { if (e.message && e.message.indexOf('resetting') < 0) show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { var m = e.reason && (e.reason.message || e.reason); if (m && !window.__waveReady) show(m); });
      setTimeout(function () { if (!window.__waveReady) show('시작 시간이 초과됐어요'); }, 15000);
    })();
  </script>
  <script src="vendor/pdf-lib.min.js" defer></script>
  <script src="vendor/fontkit.umd.min.js" defer></script>
  <script src="vendor/Sortable.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon" id="btnMenu" title="메뉴"></button>
      <button class="icon" id="btnPanel" title="목차·주석 목록"></button>
      <div id="docTitle" title="파일 이름">Wave PDF</div>
      <span id="dirtyDot" title="저장 안 된 변경사항" hidden></span>
      <span id="saveStatus" hidden></span>
      <button class="icon" id="btnAI" title="Claude에게 묻기"></button>
      <button class="icon" id="btnSearch" title="검색 (Ctrl+F)"></button>
      <button class="icon" id="btnPages" title="페이지 편집"></button>
      <button class="icon" id="btnSave" title="저장 (Ctrl+S)"></button>
    </header>
    <div id="searchBar" hidden>
      <input id="searchInput" type="search" placeholder="문서에서 검색" enterkeyhint="search" autocomplete="off">
      <span id="searchCount"></span>
      <button class="icon dark" id="searchPrev" title="이전"></button>
      <button class="icon dark" id="searchNext" title="다음"></button>
      <button class="icon dark" id="searchClose" title="닫기"></button>
    </div>
    <main id="main">
      <aside id="sidePanel" hidden>
        <div class="seg" id="panelTabs">
          <button class="seg-btn on" data-tab="outline">목차</button>
          <button class="seg-btn" data-tab="annots">주석</button>
        </div>
        <div id="panelBody"></div>
      </aside>
      <div id="viewerContainer" data-tool="hand">
        <div id="viewer" class="pdfViewer"></div>
      </div>
      <section id="welcome">
        <div class="wl-card">
          <div class="wl-logo"><img src="icons/icon-192.png" alt=""></div>
          <h1>Wave PDF</h1>
          <p class="muted">PDF 보기 · 하이라이트 · 주석 · 서명 · 페이지 편집</p>
          <button class="btn primary big" id="wlOpen"></button>
          <button class="btn big" id="wlDrive"></button>
          <button class="btn big" id="wlResume" hidden></button>
          <p class="muted small" id="wlHint">PDF·워드·엑셀 파일을 이 창으로 끌어다 놓아도 열려요</p>
        </div>
      </section>
      <div id="zoomCtl" hidden>
        <button class="icon dark" id="viewMode" title="보기 모드: 기본 → 흑백 반전 → 세피아 (D)"></button>
        <button id="pageInd" title="페이지 이동">1 / 1</button>
        <span class="vsep"></span>
        <button class="icon dark" id="zoomOut" title="축소"></button>
        <button id="zoomVal" title="폭 맞춤 / 쪽 맞춤">100%</button>
        <button class="icon dark" id="zoomIn" title="확대"></button>
      </div>
      <div id="toolOptions" hidden></div>
    </main>
    <nav id="toolbar">
      <div class="tools" id="tools"></div>
      <div class="hist">
        <button class="tool" id="btnUndo" title="실행 취소 (Ctrl+Z)" disabled></button>
        <button class="tool" id="btnRedo" title="다시 실행 (Ctrl+Y)" disabled></button>
      </div>
    </nav>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf,.docx,.doc,.rtf,.odt,.txt,.xlsx,.xls,.csv,.ods,.pptx,.ppt,.odp" hidden>
</body>
</html>
